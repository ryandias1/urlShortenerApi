services:
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - "--api.insecure=true" # Habilita o dashboard (remova em produção real)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"       # Porta HTTP
      - "8080:8080"   # Porta do Dashboard do Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  db:
    image: postgres:16
    container_name: my-postgres
    restart: always
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:latest
    container_name: my-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass mysecretpassword

  api:
    container_name: api-shorten
    build: ./
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-shorten.rule=Host(`api.localhost`)" # Seu domínio aqui
      - "traefik.http.routers.api-shorten.entrypoints=web"
      - "traefik.http.services.api-shorten.loadbalancer.server.port=3003" # Porta interna da sua API
    env_file:
      - ./.env
    depends_on:
      - db
      - cache
volumes:
  postgres_data: